# MultiView build config — Minecraft 26.1.x
# Apply via: ./scripts/build-version.sh 26.1
# Uses the unobfuscated Fabric Loom plugin.

minecraft_version=26.1.2
loader_version=0.19.2
fabric_version=0.148.2+26.1.2
loom_version=1.17.20

# yarn_mappings is intentionally unset — Loom defaults to mojmap.
yarn_mappings=

# Flashback 0.43.6 for 26.1.x
flashback_version=0.43.6
flashback_modrinth_id=4das1Fjq
flashback_filename_pattern=Flashback-${flashback_version}-for-MC26.1.jar
flashback_modrinth_project_id=4das1Fjq
flashback_modrinth_version_id=7ySPweGE
flashback_download_url=https://cdn.modrinth.com/data/4das1Fjq/versions/7ySPweGE/Flashback-0.43.6-for-MC26.1.jar
flashback_sha512=adf7ef7d22d1a3a2960b835f70b9dbab1ff70c1a18bcb2adaf09bd705a8cb18b88801fa747ea32ef97f3b34b86310838007770cb521dcf3d67fa78132beb64f8

mod_minecraft_dep=>=26.1 <26.2
mod_flashback_dep=>=0.43.6 <0.44

# Selects unobfuscated Fabric Loom
no_intermediate=true

# MC 26.1+ requires Java 25
java_version=25

modrinth_game_versions=26.1,26.1.1,26.1.2
