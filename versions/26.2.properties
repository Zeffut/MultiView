# MultiView build config — Minecraft 26.2 stable.
# Apply via: ./scripts/build-version.sh 26.2
# Uses mojmap directly with noIntermediateMappings().
minecraft_version=26.2
loader_version=0.19.2
fabric_version=0.150.0+26.2
loom_version=1.16-SNAPSHOT

yarn_mappings=
# Flashback 0.43.2 is the latest stable 26.2 host release.
flashback_version=0.43.2
flashback_modrinth_id=4das1Fjq
flashback_filename_pattern=Flashback-${flashback_version}-for-MC26.2.jar

mod_minecraft_dep=>=26.2 <26.3
mod_flashback_dep=>=0.43.2 <0.44
no_intermediate=true
java_version=25
modrinth_game_versions=26.2
