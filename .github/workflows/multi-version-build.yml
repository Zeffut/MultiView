name: Maintenance matrix
on:
  push:
    branches: [maintenance/0.5.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: ['1.21.9', '1.21.11', '26.1', '26.2', '26.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Build and run automated tests
        run: ./scripts/build-version.sh '${{ matrix.target }}'
      - name: Checksum final jar
        run: sha256sum build/libs/multiview-*-mc'${{ matrix.target }}'.jar > build/libs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: multiview-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/libs/multiview-*-mc${{ matrix.target }}.jar
            build/libs/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/test-results/test/*.xml
          if-no-files-found: warn
