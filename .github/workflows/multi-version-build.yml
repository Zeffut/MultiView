name: Minecraft 26.2 build

on:
  pull_request:
    branches: [main]
  push:
    branches: [port/26.2]
  workflow_dispatch:

jobs:
  build:
    name: Build MC 26.2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-26.2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'versions/26.2.properties', 'scripts/download-flashback.sh') }}
          restore-keys: |
            ${{ runner.os }}-gradle-26.2-

      - name: Download and verify Flashback 0.43.2
        run: |
          set -e
          chmod +x scripts/download-flashback.sh scripts/build-version.sh
          ./scripts/download-flashback.sh 26.2

      - name: Build and test for MC 26.2
        run: |
          set -e
          chmod +x scripts/build-version.sh
          ./scripts/build-version.sh 26.2

      - name: Record artifact checksum
        run: sha512sum build/libs/multiview-*-mc26.2.jar | tee build/libs/multiview-mc26.2.sha512

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiview-mc26.2
          path: |
            build/libs/multiview-*-mc26.2.jar
            build/libs/multiview-mc26.2.sha512
          if-no-files-found: error
